<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂流瓶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0a1e2e;
    --mid:#123b4d;
    --mid2:#0f2f3d;
    --foam:#a9d9c5;
    --amber:#d9a05b;
    --amber-dim:#b9834a;
    --parchment:#f3ead8;
    --ink:#2b2016;
    --moon:#eaf2f0;
    --moon-dim:#9fb8bb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(ellipse at 50% -10%, #1a3a4d 0%, var(--deep) 55%, #061219 100%);
    color:var(--moon);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
    position:relative;
    height:100vh;
    width:100vw;
  }
  .serif{font-family:"Noto Serif SC",serif;}

  /* ---------- 背景海面与漂浮瓶子 ---------- */
  #ocean{position:absolute;inset:0;overflow:hidden;z-index:0;}
  .wave{
    position:absolute;left:-10%;width:120%;height:140px;
    background:linear-gradient(180deg, rgba(169,217,197,0.06), rgba(169,217,197,0));
    border-radius:50%;
    animation:sway 9s ease-in-out infinite;
  }
  .wave.w1{bottom:6%;animation-duration:11s;}
  .wave.w2{bottom:0%;animation-duration:14s;opacity:.6;}
  @keyframes sway{
    0%,100%{transform:translateX(0) scaleY(1);}
    50%{transform:translateX(3%) scaleY(1.15);}
  }
  .drift-bottle{
    position:absolute;font-size:22px;opacity:.35;
    animation:drift linear infinite;
    filter:drop-shadow(0 0 6px rgba(217,160,91,0.15));
  }
  @keyframes drift{
    from{transform:translateX(-10vw) translateY(0) rotate(-8deg);}
    to{transform:translateX(110vw) translateY(-30px) rotate(8deg);}
  }

  /* ---------- 首页 ---------- */
  #home{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  #home h1{
    font-size:42px;letter-spacing:6px;margin:0 0 8px;color:var(--moon);
    text-shadow:0 0 24px rgba(169,217,197,0.25);
  }
  #home p.tag{color:var(--moon-dim);font-size:14px;margin:0 0 44px;letter-spacing:1px;}
  .btn-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
  .round-btn{
    width:128px;height:128px;border-radius:50%;
    border:1px solid rgba(217,160,91,0.35);
    background:radial-gradient(circle at 35% 30%, rgba(217,160,91,0.18), rgba(18,59,77,0.4));
    color:var(--moon);font-size:16px;font-family:"Noto Serif SC",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .round-btn .ico{font-size:30px;}
  .round-btn:active{transform:scale(0.94);}
  .round-btn:hover{box-shadow:0 0 26px rgba(217,160,91,0.25);}
  #mybottles-link{
    margin-top:40px;background:none;border:none;color:var(--moon-dim);
    font-size:13px;letter-spacing:1px;text-decoration:underline;cursor:pointer;
    font-family:inherit;
  }

  /* ---------- 通用遮罩层 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:10;
    background:rgba(6,15,22,0.72);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay.center{align-items:center;}
  .sheet{
    width:100%;max-width:480px;background:var(--mid2);
    border-radius:22px 22px 0 0;padding:22px 20px 26px;
    transform:translateY(24px);transition:transform .3s ease;
    max-height:88vh;overflow-y:auto;
    border-top:1px solid rgba(169,217,197,0.15);
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet h2{margin:0 0 14px;font-size:19px;font-weight:600;color:var(--moon);}
  .close-x{
    position:absolute;top:14px;right:18px;background:none;border:none;
    color:var(--moon-dim);font-size:22px;cursor:pointer;line-height:1;
  }

  /* ---------- 写瓶子 ---------- */
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab-btn{
    flex:1;padding:9px 0;border-radius:10px;border:1px solid rgba(169,217,197,0.2);
    background:transparent;color:var(--moon-dim);font-size:14px;cursor:pointer;
    font-family:inherit;
  }
  .tab-btn.active{background:rgba(217,160,91,0.18);color:var(--amber);border-color:var(--amber-dim);}
  textarea#text-input{
    width:100%;min-height:130px;border-radius:12px;border:1px solid rgba(169,217,197,0.2);
    background:rgba(255,255,255,0.04);color:var(--moon);padding:12px;font-size:15px;
    font-family:"Noto Serif SC",serif;resize:vertical;line-height:1.6;
  }
  textarea#text-input::placeholder{color:var(--moon-dim);}
  #draw-pane canvas{
    width:100%;height:200px;border-radius:12px;background:#fdfaf2;touch-action:none;display:block;
  }
  .draw-tools{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .swatch.active{border-color:var(--moon);}
  .small-btn{
    padding:7px 14px;border-radius:9px;border:1px solid rgba(169,217,197,0.25);
    background:transparent;color:var(--moon-dim);font-size:13px;cursor:pointer;font-family:inherit;
  }
  .primary-btn{
    width:100%;margin-top:18px;padding:14px 0;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--amber),var(--amber-dim));
    color:#241a0e;font-size:16px;font-weight:600;cursor:pointer;font-family:"Noto Serif SC",serif;
    letter-spacing:1px;
  }
  .primary-btn:disabled{opacity:.4;}
  .ghost-btn{
    width:100%;margin-top:10px;padding:12px 0;border-radius:12px;
    border:1px solid rgba(169,217,197,0.2);background:transparent;color:var(--moon-dim);
    font-size:14px;cursor:pointer;font-family:inherit;
  }

  /* ---------- 打捞到的瓶子 ---------- */
  .letter-card{
    width:100%;max-width:420px;background:var(--parchment);color:var(--ink);
    border-radius:16px;padding:26px 22px;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    transform:scale(.9);opacity:0;transition:all .35s ease;
    max-height:82vh;overflow-y:auto;
  }
  .overlay.show .letter-card{transform:scale(1);opacity:1;}
  .letter-card .meta{font-size:12px;color:#7a6b52;margin-bottom:14px;letter-spacing:.5px;}
  .letter-content{font-family:"Noto Serif SC",serif;font-size:17px;line-height:1.9;white-space:pre-wrap;word-break:break-word;}
  .letter-content img{max-width:100%;border-radius:8px;display:block;}
  .empty-sea{font-family:"Noto Serif SC",serif;font-size:16px;color:#7a6b52;text-align:center;padding:20px 0;}
  .reply-block{margin-top:20px;border-top:1px dashed #c9bb9e;padding-top:16px;}
  .reply-item{
    background:rgba(0,0,0,0.04);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    font-size:14px;line-height:1.6;
  }
  .reply-item .rtime{font-size:11px;color:#8a7c62;margin-top:4px;display:block;}
  textarea#reply-input{
    width:100%;min-height:60px;border-radius:10px;border:1px solid #d8cba9;
    padding:10px;font-size:14px;font-family:inherit;resize:vertical;background:#fffdf7;color:var(--ink);
  }
  .letter-actions{display:flex;gap:10px;margin-top:14px;}
  .letter-actions button{flex:1;}
  .amber-btn{
    padding:11px 0;border-radius:10px;border:none;background:var(--amber);color:#241a0e;
    font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .outline-btn{
    padding:11px 0;border-radius:10px;border:1px solid #c9bb9e;background:transparent;color:#5c4f39;
    font-size:14px;cursor:pointer;font-family:inherit;
  }
  .loading-dot{font-size:14px;color:var(--moon-dim);text-align:center;padding:30px 0;}

  /* ---------- 我扔出的瓶子 ---------- */
  .mine-item{
    background:rgba(255,255,255,0.04);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    cursor:pointer;
  }
  .mine-item .mtext{font-family:"Noto Serif SC",serif;font-size:14px;color:var(--moon);
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .mine-item .mmeta{font-size:12px;color:var(--moon-dim);margin-top:6px;}
  .mine-item .mmeta b{color:var(--amber);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px;}
</style>
</head>
<body>

<div id="ocean">
  <div class="wave w1"></div>
  <div class="wave w2"></div>
</div>

<div id="home">
  <h1 class="serif">漂流瓶</h1>
  <p class="tag">写一段心事，扔进海里；或打捞一个，认识陌生人的月光</p>
  <div class="btn-row">
    <div class="round-btn" id="btn-write"><span class="ico">✍️</span>写一个瓶子</div>
    <div class="round-btn" id="btn-fish"><span class="ico">🌊</span>打捞瓶子</div>
  </div>
  <button id="mybottles-link">我扔出的瓶子 →</button>
  <p id="mode-note" style="display:none;margin-top:18px;font-size:12px;color:var(--amber);letter-spacing:.5px;">
    当前连接到漂流瓶服务器：瓶子会保存到服务器
  </p>
</div>

<!-- 写瓶子 -->
<div class="overlay" id="overlay-write">
  <div class="sheet" style="position:relative;">
    <button class="close-x" data-close="overlay-write">×</button>
    <h2 class="serif">写下你的漂流瓶</h2>
    <div class="tabs">
      <button class="tab-btn active" id="tab-text">文字</button>
      <button class="tab-btn" id="tab-draw">画画</button>
    </div>
    <div id="text-pane">
      <textarea id="text-input" placeholder="写点什么吧……不需要署名，海会替你保密。" maxlength="500"></textarea>
    </div>
    <div id="draw-pane" style="display:none;">
      <canvas id="draw-canvas" width="600" height="400"></canvas>
      <div class="draw-tools">
        <div class="swatch active" style="background:#2b2016" data-color="#2b2016"></div>
        <div class="swatch" style="background:#c0392b" data-color="#c0392b"></div>
        <div class="swatch" style="background:#2d6a4f" data-color="#2d6a4f"></div>
        <div class="swatch" style="background:#1d4e89" data-color="#1d4e89"></div>
        <div class="swatch" style="background:#d9a05b" data-color="#d9a05b"></div>
        <button class="small-btn" id="clear-canvas">清空画板</button>
      </div>
    </div>
    <button class="primary-btn" id="btn-throw" disabled>扔进大海</button>
    <div id="throw-status" style="text-align:center;font-size:13px;color:var(--moon-dim);margin-top:10px;"></div>
  </div>
</div>

<!-- 打捞结果 -->
<div class="overlay center" id="overlay-fish">
  <div class="letter-card" id="letter-card">
    <div id="letter-body"><div class="loading-dot">正在打捞……</div></div>
  </div>
</div>

<!-- 我扔出的瓶子 -->
<div class="overlay" id="overlay-mine">
  <div class="sheet" style="position:relative;">
    <button class="close-x" data-close="overlay-mine">×</button>
    <h2 class="serif">我扔出的瓶子</h2>
    <div id="mine-list"><div class="loading-dot">加载中……</div></div>
  </div>
</div>

<script>
(function(){
  const $ = (sel)=>document.querySelector(sel);
  const $$ = (sel)=>document.querySelectorAll(sel);

  const BOTTLES_KEY = 'driftbottle:bottles';
  const MYID_KEY = 'driftbottle:myid';

  let myId = null;
  let allBottles = [];
  let currentFished = null;
  let drawColor = '#2b2016';
  let drawing = false;

  function uid(){ return 'u_' + Math.random().toString(36).slice(2,10); }
  function timeAgo(ts){
    const d = Date.now()-ts;
    const m = Math.floor(d/60000);
    if(m<1) return '刚刚';
    if(m<60) return m+' 分钟前';
    const h = Math.floor(m/60);
    if(h<24) return h+' 小时前';
    return Math.floor(h/24)+' 天前';
  }

  // ---------- 后端 API ----------
  // 本地开发时：把 index.html 和 server.py 放在同一服务器目录，
  // 浏览器直接访问 http://127.0.0.1:8080/ 即可。
  const API_BASE = '';

  async function api(path, options={}){
    const res = await fetch(API_BASE + path, {
      headers: {'Content-Type':'application/json', ...(options.headers||{})},
      ...options
    });
    let data = null;
    try { data = await res.json(); } catch(e) {}
    if(!res.ok){
      throw new Error((data && data.error) || ('HTTP '+res.status));
    }
    return data;
  }

  async function initIdentity(){
    let saved = localStorage.getItem(MYID_KEY);
    if(!saved){
      saved = uid();
      localStorage.setItem(MYID_KEY, saved);
    }
    myId = saved;
  }

  function openOverlay(id){ $('#'+id).classList.add('show'); }
  function closeOverlay(id){ $('#'+id).classList.remove('show'); }

  $$('[data-close]').forEach(btn=>{
    btn.addEventListener('click', ()=> closeOverlay(btn.dataset.close));
  });

  // ---------- 写瓶子 ----------
  $('#btn-write').addEventListener('click', ()=>{
    openOverlay('overlay-write');
  });

  $('#tab-text').addEventListener('click', ()=>{
    $('#tab-text').classList.add('active');
    $('#tab-draw').classList.remove('active');
    $('#text-pane').style.display='block';
    $('#draw-pane').style.display='none';
    updateThrowEnabled();
  });
  $('#tab-draw').addEventListener('click', ()=>{
    $('#tab-draw').classList.add('active');
    $('#tab-text').classList.remove('active');
    $('#draw-pane').style.display='block';
    $('#text-pane').style.display='none';
    updateThrowEnabled();
  });

  function activeMode(){
    return $('#tab-draw').classList.contains('active') ? 'draw' : 'text';
  }

  function updateThrowEnabled(){
    const btn = $('#btn-throw');
    if(activeMode()==='text'){
      btn.disabled = $('#text-input').value.trim().length === 0;
    }else{
      btn.disabled = !canvasHasContent();
    }
  }
  $('#text-input').addEventListener('input', updateThrowEnabled);

  // 画板
  const canvas = $('#draw-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fdfaf2';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  let hasDrawn = false;
  function canvasHasContent(){ return hasDrawn; }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const point = e.touches ? e.touches[0] : e;
    return { x:(point.clientX-rect.left)*scaleX, y:(point.clientY-rect.top)*scaleY };
  }
  function startDraw(e){
    drawing = true; hasDrawn = true;
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    updateThrowEnabled();
  }
  function moveDraw(e){
    if(!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    ctx.strokeStyle = drawColor;
    ctx.lineTo(p.x,p.y); ctx.stroke();
  }
  function endDraw(){ drawing = false; }
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:true});
  canvas.addEventListener('touchmove', moveDraw, {passive:false});
  canvas.addEventListener('touchend', endDraw);

  $$('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      $$('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      drawColor = sw.dataset.color;
    });
  });
  $('#clear-canvas').addEventListener('click', ()=>{
    ctx.fillStyle = '#fdfaf2';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    hasDrawn = false;
    updateThrowEnabled();
  });

  $('#btn-throw').addEventListener('click', async ()=>{
    const mode = activeMode();
    const bottle = {
      type: mode,
      content: mode==='text' ? $('#text-input').value.trim() : canvas.toDataURL('image/png')
    };

    $('#btn-throw').disabled = true;
    $('#throw-status').textContent = '正在扔向大海……';

    try{
      const result = await api('/api/throw', {
        method:'POST',
        body: JSON.stringify({authorId: myId, ...bottle})
      });
      $('#throw-status').textContent = '瓶子已经漂向远方 🌊';
      setTimeout(()=>{
        closeOverlay('overlay-write');
        $('#text-input').value='';
        $('#clear-canvas').click();
        $('#throw-status').textContent='';
        updateThrowEnabled();
      }, 900);
    }catch(e){
      console.error(e);
      $('#throw-status').textContent = '扔失败：' + e.message;
      $('#btn-throw').disabled = false;
    }
  });

  // ---------- 打捞 ----------
  $('#btn-fish').addEventListener('click', async ()=>{
    openOverlay('overlay-fish');
    $('#letter-body').innerHTML = '<div class="loading-dot">正在打捞……</div>';
    try{
      const data = await api('/api/fish?authorId=' + encodeURIComponent(myId));
      if(!data.bottle){
        $('#letter-body').innerHTML = '<div class="empty-sea">大海还很安静，一个瓶子都没有。<br>要不先扔一个？</div>';
        currentFished = null;
        return;
      }
      currentFished = data.bottle;
      renderLetter(currentFished);
    }catch(e){
      $('#letter-body').innerHTML = '<div class="empty-sea">打捞失败：'+escapeHtml(e.message)+'</div>';
    }
  });

  function renderLetter(bottle){
    const contentHtml = bottle.type === 'text'
      ? escapeHtml(bottle.content)
      : `<img src="${bottle.content}" alt="漂流瓶画作">`;
    const repliesHtml = (bottle.replies||[]).map(r=>`
      <div class="reply-item">${escapeHtml(r.text)}<span class="rtime">${timeAgo(r.createdAt)}</span></div>
    `).join('');
    $('#letter-body').innerHTML = `
      <div class="meta">一个漂流了 ${timeAgo(bottle.createdAt)} 的瓶子</div>
      <div class="letter-content">${contentHtml}</div>
      <div class="reply-block">
        <textarea id="reply-input" placeholder="回一句话给写瓶子的人……"></textarea>
        <div class="letter-actions">
          <button class="outline-btn" id="btn-refish">再捞一个</button>
          <button class="amber-btn" id="btn-reply">扔回大海（回复）</button>
        </div>
        ${repliesHtml ? '<div style="margin-top:14px;">'+repliesHtml+'</div>' : ''}
      </div>
    `;
    $('#btn-refish').addEventListener('click', ()=> $('#btn-fish').click());
    $('#btn-reply').addEventListener('click', submitReply);
  }

  async function submitReply(){
    const input = $('#reply-input');
    const text = input.value.trim();
    if(!text || !currentFished) return;
    const btn = $('#btn-reply');
    btn.disabled = true; btn.textContent = '正在投递……';
    try{
      const data = await api('/api/reply', {
        method:'POST',
        body: JSON.stringify({
          authorId: myId,
          bottleId: currentFished.id,
          text
        })
      });
      currentFished = data.bottle;
      renderLetter(currentFished);
    }catch(e){
      btn.disabled = false;
      btn.textContent = '扔回大海（回复）';
      alert('回复失败：' + e.message);
    }
  }

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  // ---------- 我扔出的瓶子 ----------
  $('#mybottles-link').addEventListener('click', async ()=>{
    openOverlay('overlay-mine');
    $('#mine-list').innerHTML = '<div class="loading-dot">加载中……</div>';
    try{
      const data = await api('/api/mine?authorId=' + encodeURIComponent(myId));
      const mine = data.bottles || [];
      if(mine.length===0){
        $('#mine-list').innerHTML = '<div class="empty-sea" style="color:var(--moon-dim);">你还没有扔出过瓶子。</div>';
        return;
      }
      $('#mine-list').innerHTML = mine.map(b=>{
        const preview = b.type==='text' ? escapeHtml(b.content) : '[一幅画]';
        const replyCount = (b.replies||[]).length;
        return `<div class="mine-item" data-id="${escapeHtml(b.id)}">
          <div class="mtext">${preview}</div>
          <div class="mmeta">${timeAgo(b.createdAt)} · 收到 <b>${replyCount}</b> 条回复</div>
        </div>`;
      }).join('');
      $$('.mine-item').forEach(el=>{
        el.addEventListener('click', async ()=>{
          try{
            const data = await api('/api/bottle/' + encodeURIComponent(el.dataset.id));
            if(!data.bottle) return;
            closeOverlay('overlay-mine');
            currentFished = data.bottle;
            openOverlay('overlay-fish');
            renderLetter(currentFished);
          }catch(e){ alert('加载失败：'+e.message); }
        });
      });
    }catch(e){
      $('#mine-list').innerHTML = '<div class="empty-sea">加载失败：'+escapeHtml(e.message)+'</div>';
    }
  });

  // ---------- 启动 ----------
  (async function boot(){
    $('#mode-note').style.display = 'block';
    await initIdentity();
  })();
})();
</script>
</body>
</html>
